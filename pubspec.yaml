
name: irana
description: IRANA Global Social Network
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # انتخاب عکس و ویدئو از گالری
  image_picker: ^1.1.2

  # ذخیره فایل‌های رسانه‌ای
  path_provider: ^2.1.5

  # ذخیره اطلاعات برنامه
  shared_preferences: ^2.3.2

  # پخش ویدئو
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
