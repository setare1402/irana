
name: Build IRANA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/safe-localization

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        run: flutter create --platforms=android .

      - name: Configure Maven mirrors for Android build
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/settings.gradle.kts')
          s = p.read_text()
          marker = 'repositories {'
          mirrors = '''repositories {
                  maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
                  maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
                  maven { url = uri("https://maven.aliyun.com/repository/google") }
                  maven { url = uri("https://maven.aliyun.com/repository/public") }'''
          assert s.count(marker) == 1, f'Expected 1 repository block in settings.gradle.kts, found {s.count(marker)}'
          s = s.replace(marker, mirrors, 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Generate Android launcher icon only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          s = p.read_text()
          old = '  ios: true'
          assert s.count(old) == 1, 'Expected exactly one iOS icon setting'
          p.write_text(s.replace(old, '  ios: false', 1))
          PY
          dart run flutter_launcher_icons

      - name: Skip incompatible Android lint task
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/init.gradle" <<'EOF'
          gradle.projectsEvaluated {
              allprojects {
                  tasks.matching { it.name == 'lintVitalAnalyzeRelease' }.configureEach {
                      enabled = false
                  }
              }
          }
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: irana-android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: Build iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate iOS project files
        run: flutter create --platforms=ios .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate iOS launcher icon only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          s = p.read_text()
          old = '  android: true'
          assert s.count(old) == 1, 'Expected exactly one Android icon setting'
          p.write_text(s.replace(old, '  android: false', 1))
          PY
          dart run flutter_launcher_icons

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: irana-ios
          path: build/ios/iphoneos/Runner.app
