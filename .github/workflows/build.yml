
name: Build IRANA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android launcher icon only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          s = p.read_text()
          old = '  ios: true\n'
          assert s.count(old) == 1, 'Expected exactly one iOS icon setting'
          p.write_text(s.replace(old, '  ios: false\n', 1))
          PY
          dart run flutter_launcher_icons

      - name: Skip incompatible Android lint task
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/init.gradle" <<'EOF'
          gradle.projectsEvaluated {
              allprojects {
                  tasks.matching { it.name == 'lintVitalAnalyzeRelease' }.configureEach {
                      enabled = false
                  }
              }
          }
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: irana-android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: Build iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate iOS project files
        run: flutter create --platforms=ios .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate iOS launcher icon only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          s = p.read_text()
          old = '  android: true\n'
          assert s.count(old) == 1, 'Expected exactly one Android icon setting'
          p.write_text(s.replace(old, '  android: false\n', 1))
          PY
          dart run flutter_launcher_icons

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: irana-ios
          path: build/ios/iphoneos/Runner.app
